name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Chrome & Firefox extensions
        run: |
          npm run build
          npm run build:firefox

      - name: Package release ZIPs
        run: |
          npm run zip
          npm run zip:firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitext-web-translator-packages
          path: .output/*.zip
